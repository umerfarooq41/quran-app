name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, UI checks and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive UI and interaction tests
        run: npx playwright test

      - name: Upload Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
