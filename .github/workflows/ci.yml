name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, UI checks and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Capacitor bridge dependencies for CI build
        # App and Haptics are imported on native-only paths, but Vite still
        # resolves their modules when bundling the web app.
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/app@7 @capacitor/haptics@7

      - name: Run unit tests
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test @axe-core/playwright

      - name: Install Chromium and media inspection tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffprobe

      - name: Run responsive UI and interaction tests
        run: npx playwright test

      - name: Upload Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
