name: Android Release APK

on:
  workflow_dispatch:

jobs:
  release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then echo "::error::Missing signing secret: $var"; exit 1; fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Install Capacitor for Android build
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @capacitor/haptics@7
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync assets
        run: npx cap sync android
      - name: Generate Android launcher icons from existing Quran App logo
        run: |
          python3 -m pip install --user --break-system-packages Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("public/icons/icon-512.png")
          if not source.is_file():
              raise SystemExit("Missing existing Quran App icon: public/icons/icon-512.png")
          logo = Image.open(source).convert("RGBA")
          if logo.width < 192 or logo.height < 192:
              raise SystemExit("Existing icon is too small for Android launcher")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          root = Path("android/app/src/main/res")
          for density, size in sizes.items():
              dest = root / f"mipmap-{density}"
              dest.mkdir(parents=True, exist_ok=True)
              icon = logo.resize((size, size), Image.Resampling.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  icon.save(dest / name)
          # Avoid the default Capacitor adaptive icon's foreground/background combination.
          for directory in (root / "mipmap-anydpi", root / "mipmap-anydpi-v26"):
              if directory.exists():
                  for file in directory.glob("ic_launcher*.xml"):
                      file.unlink()
          print("Generated launcher icons using", source)
          PY
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          
          android {
              signingConfigs {
                  releaseSigning {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.releaseSigning
                  }
              }
          }
          GRADLE
          cd android
          bash gradlew assembleRelease --no-daemon
      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
